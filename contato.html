<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="cabecalho">
        <div class="logo">💻 TechVanguard</div>
        <nav class="menu">
            <a href="index.html" target="_blank">Serviços</a>
            <a href="sobreNos.html" target="_blank">Sobre Nós</a>
            <a href="" target="_blank">Contato</a>
        </nav>
    </header>
    <main class="container">
        <h1 class="tituloSecao">Cadastro para Solicitação de Serviços</h1>
        <p class="subtitulo">Preencha seus dados para solicitar um de nossos serviços</p><br>
        <div class="areaInscricao">
            <form action="/processar-cadastro" method="post" class="colunaForm">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite Seu Nome" required minlength="3" maxlength="50"><br>

                <label for="senha">Senha de Acesso:</label>
                <input type="password" id="senha" name="senha" placeholder="Digite Sua Senha" required minlength="8" maxlength="15"><br>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="exemplo@dominio.com" required><br>

                <label for="dateNasc">Data de Nascimento:</label>
                <input type="date" id="dataNasc" name="dataNascimento" min="1900-01-01" max="2026-12-31" required><br><br>

                <label>Serviço que deseja solicitar</label><br>
                <input type="checkbox" id="acao" name="interesse" value="acao">
                <label for="acao">Computação em Nuvem</label><br>
                <input type="checkbox" id="comedia" name="interesse" value="comedia">
                <label for="comedia">Segurança Cibernética</label><br>
                <input type="checkbox" id="terror" name="interesse" value="terror">
                <label for="terror">Inteligência Artificial</label><br><br>
                

                <label for="unidade">Selecione a sua Cidade</label>
                <select name="unidade" id="unidade">
                    <option value="" disa selected>Selecione uma Cidade</option>
                    <option value="sp">São Paulo - Capital</option>
                    <option value="votuporanga">Votuporanga</option>
                    <option value="sebastianopolis">Sebastianópolis do Sul</option>
                    <option value="dourados">Dourados</option>
                    <option value="campo">Campo Grande</option>
                    <option value="valentim">Valentim Gentil</option>
                    <option value="parisi">Parisi</option>
                    <option value="saojose">São José do Rio Preto</option>
                    <option value="cardoso">Cardoso</option>
                </select><br><br>

                <input type="checkbox" id="termos" name="termos" required>
                <label for="termos">Li e Aceito os Termos</label><br><br>

                <button type="submit" class="btnEnviar">Enviar</button>
                <button type="reset" class="btnLimpar">Limpar Tudo</button>
            </form> 
        </div>
    </main>
</body>
</html>
